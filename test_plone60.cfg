[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-6.0.x.cfg
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/qa.cfg
    base.cfg

update-versions-file = test_plone60.cfg

[versions]
createcoverage = 1.5
watchdog = 2.1.6
# The Plone 6.0 test buildout resolves pkg_resources-style (old-namespace)
# z3c.* packages (z3c.objpath 2.0, z3c.form 5.1, ...). z3c.jbot 3.x is a
# PEP 420 namespace package and cannot be imported alongside them ("No
# module named 'z3c.jbot'"), so pin the 2.x line here. The site buildout
# uses the all-PEP 420 z3c.* set and stays on z3c.jbot 3.1 (see
# buildout.cfg).
z3c.jbot = 2.2
